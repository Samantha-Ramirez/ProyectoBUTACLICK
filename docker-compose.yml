services:
    # Base de datos (PostgreSQL)
    db:
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_DB: butaclick_db
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - butaclick_net

    # Backend (Laravel)
    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        volumes:
            - .:/var/www/html
            - backend_vendor:/var/www/html/vendor
        depends_on:
            - db
        networks:
            - butaclick_net

    # Frontend (Vue PWA)
    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        volumes:
            - .:/app
            - frontend_node_modules:/app/node_modules
        ports:
            - '5173:5173'
        networks:
            - butaclick_net

    # Servidor web (Nginx)
    nginx:
        image: nginx:alpine
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend
            - frontend
        networks:
            - butaclick_net

networks:
    butaclick_net:
        driver: bridge

volumes:
    postgres_data:
    backend_vendor:
    frontend_node_modules:
