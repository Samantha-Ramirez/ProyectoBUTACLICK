services:
    # Levantar base de datos PostgreSQL para persistir datos de la aplicacion.
    db:
        image: postgres:15-alpine
        restart: always
        environment:
            POSTGRES_DB: butaclick_db
            POSTGRES_USER: admin
            POSTGRES_PASSWORD: password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - butaclick_net

    # Levantar backend Laravel para exponer PHP-FPM en la red interna.
    backend:
        build:
            context: .
            dockerfile: Dockerfile.backend
        volumes:
            - .:/var/www/html
            # Persistir dependencias PHP para evitar reinstalar en cada inicio.
            - backend_vendor:/var/www/html/vendor
        depends_on:
            - db
        networks:
            - butaclick_net

    # Levantar frontend Vue con Vite para compilar y servir assets en desarrollo.
    frontend:
        build:
            context: .
            dockerfile: Dockerfile.frontend
        volumes:
            - .:/app
            # Persistir dependencias Node para evitar reinstalar en cada inicio.
            - frontend_node_modules:/app/node_modules
        ports:
            - '5173:5173'
        networks:
            - butaclick_net

    # Levantar Nginx para enrutar HTTP hacia Laravel y servir la app web.
    nginx:
        image: nginx:alpine
        ports:
            - '80:80'
        volumes:
            - .:/var/www/html
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend
            - frontend
        networks:
            - butaclick_net

networks:
    butaclick_net:
        driver: bridge

volumes:
    postgres_data:
    backend_vendor:
    frontend_node_modules:
