name: CI

on:
    pull_request:
        branches: ['main']
    push:
        branches: ['main']

jobs:
    lint-test-build:
        name: lint-test-build
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: butaclick_ci
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U admin -d butaclick_ci"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        env:
            APP_ENV: testing
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            APP_DEBUG: true
            APP_URL: http://localhost
            DB_CONNECTION: pgsql
            DB_HOST: 127.0.0.1
            DB_PORT: 5432
            DB_DATABASE: butaclick_ci
            DB_USERNAME: admin
            DB_PASSWORD: password

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, pdo_pgsql, bcmath, exif, pcntl, gd, zip
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm

            - name: Cache Composer
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-composer-

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --no-progress

            - name: Install JS dependencies
              run: npm ci

            - name: Prepare Laravel env
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Run migrations
              run: php artisan migrate --force

            - name: Check backend format (Pint)
              run: composer format:check

            - name: Run backend tests
              run: php artisan test

            - name: Build frontend
              run: npm run build
